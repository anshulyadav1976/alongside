openapi: 3.1.0
info:
  title: Alongside API
  version: 0.1.0
servers:
  - url: /api/v1
paths:
  /health:
    get:
      operationId: getHealth
      responses:
        '200': { description: Service health }
  /voice/token:
    post:
      operationId: createVoiceToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                requestedSupportMode: { $ref: '#/components/schemas/SupportMode' }
                memoryEnabled: { type: boolean }
              required: [memoryEnabled]
      responses:
        '200': { description: Local session and short-lived conversation token }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /voice/webhooks/elevenlabs:
    post:
      operationId: receiveElevenLabsWebhook
      responses:
        '200': { description: Webhook durably received }
        '401': { description: Invalid signature }
  /sessions:
    get:
      operationId: listSessions
      responses:
        '200': { description: Paginated sessions }
  /sessions/{sessionId}:
    get:
      operationId: getSession
      parameters: [{ $ref: '#/components/parameters/SessionId' }]
      responses:
        '200': { description: Session details }
        '404': { $ref: '#/components/responses/NotFound' }
  /sessions/{sessionId}/transcript:
    get:
      operationId: getTranscript
      parameters: [{ $ref: '#/components/parameters/SessionId' }]
      responses:
        '200': { description: Canonical transcript turns }
        '404': { $ref: '#/components/responses/NotFound' }
  /sessions/{sessionId}/process:
    post:
      operationId: processSession
      parameters: [{ $ref: '#/components/parameters/SessionId' }]
      responses:
        '202': { description: Processing started or already underway }
        '404': { $ref: '#/components/responses/NotFound' }
  /journals/{journalId}:
    get:
      operationId: getJournal
      parameters: [{ $ref: '#/components/parameters/JournalId' }]
      responses:
        '200': { description: Journal entry }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateJournal
      parameters: [{ $ref: '#/components/parameters/JournalId' }]
      responses:
        '200': { description: Updated journal entry }
        '404': { $ref: '#/components/responses/NotFound' }
  /memories:
    get:
      operationId: listMemories
      responses:
        '200': { description: Filtered memories }
  /memories/{memoryId}:
    patch:
      operationId: updateMemory
      parameters: [{ $ref: '#/components/parameters/MemoryId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MemoryAction' }
      responses:
        '200': { description: Updated memory and graph delta }
        '404': { $ref: '#/components/responses/NotFound' }
  /graph:
    get:
      operationId: getGraph
      parameters:
        - in: query
          name: view
          schema: { type: string, enum: [current, history] }
      responses:
        '200': { description: Temporal graph nodes and edges }
  /graph/query:
    post:
      operationId: queryGraph
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                question: { type: string, minLength: 1 }
                view: { type: string, enum: [current, history] }
                selectedNodeIds:
                  type: array
                  items: { type: string }
              required: [question]
      responses:
        '200': { description: Evidence-linked graph answer }
  /support/select-mode:
    post:
      operationId: selectSupportMode
      responses:
        '200': { description: Selected support mode and rationale }
  /interventions/{interventionId}/outcome:
    post:
      operationId: recordInterventionOutcome
      parameters: [{ $ref: '#/components/parameters/InterventionId' }]
      responses:
        '200': { description: Recorded outcome }
  /checkins/decision:
    post:
      operationId: decideCheckIn
      responses:
        '200': { description: CHECK_IN or NO_ACTION decision }
  /settings/checkins:
    get:
      operationId: getCheckInSettings
      responses:
        '200': { description: Current check-in policy }
    patch:
      operationId: updateCheckInSettings
      responses:
        '200': { description: Updated check-in policy }
components:
  parameters:
    SessionId:
      in: path
      name: sessionId
      required: true
      schema: { type: string }
    JournalId:
      in: path
      name: journalId
      required: true
      schema: { type: string }
    MemoryId:
      in: path
      name: memoryId
      required: true
      schema: { type: string }
    InterventionId:
      in: path
      name: interventionId
      required: true
      schema: { type: string }
  responses:
    Unauthorized: { description: Authentication required }
    NotFound: { description: Resource not found }
  schemas:
    SupportMode:
      type: string
      enum: [witness, regulate, restore, gentle_activation, savour, meaning, narrative, human_connection, practical, open]
    MemoryAction:
      type: object
      properties:
        action:
          type: string
          enum: [confirm, edit_confirm, reject, make_temporary, change_permission, forget]
        content: { type: string }
        expiresAt: { type: string, format: date-time }
        reusePermission:
          type: string
          enum: [allowed, ask_first, never_proactive]
      required: [action]
